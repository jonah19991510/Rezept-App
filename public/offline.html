<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline · Rezeptbuch</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbf5ed; --fg: #2b221c; --muted: #6f6258; --primary: #c45e3d; --card: #fffdf9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1f1a16; --fg: #f3ece4; --muted: #b3a79c; --primary: #d97a57; --card: #29231e; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 360px; text-align: center; background: var(--card); border-radius: 24px; padding: 32px 24px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-family: ui-serif, Georgia, serif; font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Du bist offline</h1>
      <p>Das Rezeptbuch braucht eine Internetverbindung. Sobald du wieder online bist, geht es weiter.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
